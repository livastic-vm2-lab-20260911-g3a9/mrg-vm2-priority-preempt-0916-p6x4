merge_queue:
  mode: serial
  max_parallel_checks: 1

queue_rules:
  - name: VM2 fast-forward required-review parity hold
    batch_size: 1
    queue_conditions:
      - base = vm2-ff-review-base-0916
    merge_conditions:
      - check-success = vm2-ff-hold-never-0916
    merge_method: fast-forward

pull_request_rules: []
