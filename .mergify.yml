merge_queue:
  mode: serial

queue_rules:
  - name: VM2 staging permissive retarget source
    batch_size: 1
    queue_conditions:
      - base = staging
    merge_conditions: []
    merge_method: merge
  - name: VM2 main impossible retarget destination
    batch_size: 1
    queue_conditions:
      - base = main
    merge_conditions:
      - title = VM2_NEVER_MAIN_RETARGET_SUCCESS
    merge_method: merge

pull_request_rules: []
