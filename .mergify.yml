merge_queue:
  mode: serial
queue_rules:
  - name: VM2 preemption lineage queue
    batch_size: 1
    max_checks_retries: 1
    queue_conditions: []
    merge_conditions:
      - check-success = vm2-fast-security
      - check-success = vm2-slow-hold
    merge_method: merge
priority_rules:
  - name: urgent
    conditions:
      - title = VM2_HIGH_PREEMPT
    priority: high
    allow_checks_interruption: true
  - name: low
    conditions:
      - title = VM2_LOW_PREEMPT
    priority: low
pull_request_rules:
  - name: VM2 hidden Markdown body policy end-to-end proof
    conditions:
      - body ~= VM2_MD_HASH_PAREN_TOKEN
    actions:
      comment:
        message: VM2_HIDDEN_BODY_POLICY_TRIGGERED

